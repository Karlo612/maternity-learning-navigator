services:
  app:
    image: maternity-learning-navigator-app:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - app/.env
    environment:
      APP_ENV: local
      APP_NAME: Maternity Learning Navigator
      APP_KEY: base64:rWcqHSZ1rqm8wFeAi3ey4bWSwOAxJRrbNK3gEKVuhu8=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: maternity_navigator
      DB_USERNAME: maternity_app
      DB_PASSWORD: local-development-password
      GOVERNANCE_RESOURCES_PATH: /governance
      FREE_TEXT_ENABLED: "false"
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: local-development-token
      QUESTION_HMAC_KEY: local-development-hmac-key
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  ml:
    image: maternity-learning-navigator-ml:latest
    build:
      context: ml-service
    environment:
      ML_SERVICE_TOKEN: local-development-token
      MODEL_ARTIFACT_DIR: /models
    volumes:
      - model_artifacts:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/health',headers={'Authorization':'Bearer local-development-token'}); urllib.request.urlopen(r)"]
      interval: 15s
      timeout: 5s
      retries: 8

  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: maternity_navigator
      MYSQL_USER: maternity_app
      MYSQL_PASSWORD: local-development-password
      MYSQL_ROOT_PASSWORD: local-root-development-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-development-password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  model_artifacts:
