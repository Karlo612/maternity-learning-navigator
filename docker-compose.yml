services:
  app:
    image: maternity-learning-navigator-app:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_NAME: Maternity Learning Navigator
      APP_KEY: ${COMPOSE_APP_KEY:?Set COMPOSE_APP_KEY in .env}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${COMPOSE_DB_DATABASE:?Set COMPOSE_DB_DATABASE in .env}
      DB_USERNAME: ${COMPOSE_DB_USERNAME:?Set COMPOSE_DB_USERNAME in .env}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      GOVERNANCE_RESOURCES_PATH: /governance
      GOVERNANCE_SIGNOFFS_PATH: /governance/review_signoffs.json
      DEMO_REVIEW_MANIFEST_PATH: /governance/demo_review_manifest.json
      INTERFACE_CATALOG_PATH: /var/www/html/resources/js/interface-catalog.json
      FREE_TEXT_ENABLED: "false"
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${COMPOSE_ML_TOKEN:?Set COMPOSE_ML_TOKEN in .env}
      QUESTION_HMAC_KEY: ${COMPOSE_QUESTION_HMAC_KEY:?Set COMPOSE_QUESTION_HMAC_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  ml:
    image: maternity-learning-navigator-ml:latest
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      ML_SERVICE_TOKEN: ${COMPOSE_ML_TOKEN:?Set COMPOSE_ML_TOKEN in .env}
      MODEL_ARTIFACT_DIR: /models
      DEMO_MODEL_ARTIFACT_DIR: /demo-model
    volumes:
      - model_artifacts:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/health',headers={'Authorization':'Bearer '+os.environ['ML_SERVICE_TOKEN']}); urllib.request.urlopen(r)"]
      interval: 15s
      timeout: 5s
      retries: 8

  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: ${COMPOSE_DB_DATABASE:?Set COMPOSE_DB_DATABASE in .env}
      MYSQL_USER: ${COMPOSE_DB_USERNAME:?Set COMPOSE_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:?Set COMPOSE_DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  model_artifacts:
